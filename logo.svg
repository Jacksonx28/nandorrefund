<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- NANDorRefund mark: a NAND gate whose output loops back as a refund arrow.
       Gate body in currentColor, the negation bubble becomes the loop's pivot,
       arrowhead signals the return path. Original mark, drawn for this project. -->
  <path d="M14 10h14a14 22 0 0 1 0 44H14z" stroke="currentColor" stroke-width="4" fill="none"/>
  <line x1="6" y1="22" x2="14" y2="22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="6" y1="42" x2="14" y2="42" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <circle cx="45.5" cy="32" r="3.6" stroke="currentColor" stroke-width="3.4" fill="none"/>
  <path d="M49 32h3a8 8 0 0 1 8 8v2" stroke="#ffb224" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M55.5 37.5 60.2 46l4.7-8.5z" fill="#ffb224"/>
</svg>
