<style>
.signal-flow { stroke-dasharray: 10 90; animation: signal-travel 3.8s linear infinite; }
.signal-flow.secondary { animation-delay: -1.9s; }
.core-energy { animation: energy-breathe 4s ease-in-out infinite; }
@keyframes signal-travel { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes energy-breathe { 0%,100% { opacity:.25; } 50% { opacity:.75; } }
@media (prefers-reduced-motion: reduce) { .signal-flow, .core-energy { animation:none; } .signal-flow { stroke-dasharray:none; opacity:.5; } }
</style>
